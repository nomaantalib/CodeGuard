# Copy to .github/workflows/codeguard.yml in the repository you want to protect.
name: CodeGuard
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write      # needed for the PR comment
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: YOUR_ORG/codeguard-agent@v1      # <- the repo that hosts this project
        with:
          fix: "true"
          fail-on: high
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}   # optional
      - name: Comment on the PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file codeguard-report/codeguard-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeguard-report
          path: codeguard-report
