[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguard-agent"
version = "0.1.0"
description = "AI agent that reviews, tests and auto-fixes AI-written code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []          # zero runtime dependencies on purpose

[project.optional-dependencies]
tools = ["bandit", "ruff", "pip-audit"]   # optional: merged into the report when installed
dev = ["pytest"]

[project.scripts]
codeguard = "codeguard.cli:main"

[tool.setuptools.packages.find]
include = ["codeguard*"]
